// Derleme dayanikliligi: Once hizli ayna depolar (rate-limit 429 hatalarina
// karsi), sonra resmi depolar yedek olarak. GitHub Actions ve yerel derlemede
// ayni sekilde calisir.
pluginManagement {
    repositories {
        maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }
        maven { url = uri("https://maven.aliyun.com/repository/google") }
        maven { url = uri("https://maven.aliyun.com/repository/public") }
        google()          // yedek
        mavenCentral()    // yedek
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url = uri("https://maven.aliyun.com/repository/google") }
        maven { url = uri("https://maven.aliyun.com/repository/public") }
        google()          // yedek
        mavenCentral()    // yedek
    }
}
rootProject.name = "TVVideoGonder"
include ':app'
